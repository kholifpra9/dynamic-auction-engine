<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
        <defs>
            <!-- Background Gradient Indigo -->
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#3730a3" />
            </linearGradient>

            <!-- Glowing Cyan Accent -->
            <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
        </defs>

        <!-- Container Box with Rounded Corners -->
        <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />

        <!-- Base / Landasan Lelang (Sound Block) -->
        <line x1="32" y1="96" x2="96" y2="96" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />

        <!-- Gagang & Kepala Palu (Gavel & Uptrend Bid Line) -->
        <path d="M40 88 L88 40 M88 40 L72 24 M88 40 L104 56" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Live/Dynamic Signal Node (Highest Bid Point) -->
        <circle cx="98" cy="30" r="7" fill="url(#cyanGrad)" />
    </svg>